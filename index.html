<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1677f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="근무달력">
<title>근무달력</title>

<style>
:root {
  --b: #1687f8;
  --ink: #343a40;
  --muted: #858d96;
  --line: #e7ebef;
  --bg: #f4f6f8;
  --soft: #f0f3f6;
  --radius: 18px;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  font-weight: 500;
  font-size: 18px;
  line-height: 1.4;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  cursor: pointer;
  touch-action: manipulation;
  border-radius: 12px;
  font-weight: 600;
}

.app {
  max-width: 760px;
  margin: auto;
  padding: 12px 10px calc(24px + env(safe-area-inset-bottom));
}

header,
.monthrow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

header {
  margin: 4px 2px 14px;
}

h1 {
  font-size: 1.7rem;
  margin: 0;
  letter-spacing: -.04em;
  font-weight: 700;
}

.sub,
.help {
  font-size: .83rem;
  color: var(--muted);
  font-weight: 400;
}

.sub {
  margin-top: 3px;
}

.panel {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: 0 4px 16px #24364b08;
}

.today,
.primary {
  background: var(--b);
  color: #fff;
  border: 0;
  padding: 10px 14px;
  min-height: 48px;
}

.nav,
.secondary {
  background: #fff;
  border: 1px solid var(--line);
  color: var(--ink);
  min-height: 48px;
  padding: 8px 13px;
}

.nav {
  width: 48px;
  font-size: 1.4rem;
  font-weight: 500;
}

.month {
  font-size: 1.4rem;
  font-weight: 700;
}

.calendar {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
  margin-top: 10px;
  background: #fff;
}

.weekday {
  text-align: center;
  background: #f7f9fb;
  padding: 7px 0;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  font-size: .85rem;
  font-weight: 500;
}

.weekday:first-child {
  color: #b32230;
}

.weekday:last-child {
  color: #135fc1;
}

.day {
  position: relative;
  min-width: 0;
  min-height: 76px;
  padding: 4px 2px;
  background: white;
  border: 0;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  border-radius: 0;
  display: flex;
  align-items: center;
  flex-direction: column;
  gap: 3px;
  color: var(--ink);
  font-weight: 500;
}

.day.out {
  background: #fafbfc;
  color: #a6adb5;
}

.day.sel {
  background: #edf5ff;
  box-shadow: inset 0 0 0 2px var(--b);
}

.day.today {
  box-shadow: inset 0 0 0 2px #1687f8;
}

.num {
  font-size: 1rem;
  line-height: 1.8;
}

.memo-dot {
  position: absolute;
  top: 5px;
  right: 6px;
  width: 10px;
  height: 10px;
  background: #1687f8;
  border-radius: 50%;
}

.tag {
  font-size: .8rem;
  border-radius: 50%;
  width: 30px;
  height: 30px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-weight: 500;
  margin-top: 2px;
}

.주간 {
  background: #FA6255;
  color: #fff;
}

.야간 {
  background: #91BEF8;
  color: #fff;
}

.휴무 {
  background: #A6D17D;
  color: #fff;
}

.비번 {
  background: #E1C7EC;
  color: #fff;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 12px;
  margin-top: 10px;
  font-size: .8rem;
  font-weight: 400;
}

.legend span {
  display: flex;
  align-items: center;
  gap: 5px;
}

.legend i {
  width: 14px;
  height: 14px;
  border-radius: 50%;
}

h2 {
  font-size: 1.1rem;
  margin: 0 0 10px;
  font-weight: 600;
}

.selected {
  font-size: 1.08rem;
  margin-bottom: 10px;
  font-weight: 500;
}

.shifts {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 6px;
}

.shiftbtn {
  min-height: 62px;
  border: 2px solid transparent;
  font-size: 1rem;
  color: #fff;
  font-weight: 600;
}

.shiftbtn[aria-pressed="true"] {
  border-color: #0759c7;
  box-shadow: inset 0 0 0 2px white;
}

.actions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin-top: 9px;
}

.help {
  margin: 8px 0 0;
}

label {
  display: block;
  margin: 10px 0 6px;
  font-weight: 500;
}

textarea,
select {
  width: 100%;
  min-height: 50px;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px;
  background: #fff;
  color: var(--ink);
  font-weight: 400;
}

textarea {
  min-height: 85px;
  resize: vertical;
}

.summary {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 6px;
}

.countbox {
  text-align: center;
  border: 1px solid var(--line);
  background: #fafbfc;
  border-radius: 12px;
  padding: 8px 2px;
  font-weight: 500;
}

.count {
  font-size: 1.5rem;
  font-weight: 600;
}

.countbox small {
  font-size: .78rem;
  font-weight: 400;
}

.fillrow {
  margin-top: 10px;
  padding: 12px;
  background: #f5f9ff;
  border: 1px solid #e2efff;
  border-radius: 14px;
}

.fillrow .primary {
  width: 100%;
  margin-top: 8px;
}

.foot {
  text-align: center;
  color: var(--muted);
  font-size: .8rem;
  font-weight: 400;
  padding: 5px 8px;
}

dialog {
  border: 0;
  border-radius: 16px;
  width: min(92vw, 480px);
  padding: 18px;
  box-shadow: 0 10px 40px #0004;
}

dialog::backdrop {
  background: #121d2c99;
}

dialog h2 {
  font-size: 1.25rem;
}

.dlgactions {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}

.dlgactions button {
  flex: 1;
}

@media(max-width:380px) {
  body {
    font-size: 16px;
  }

  .app {
    padding-left: 6px;
    padding-right: 6px;
  }

  .panel {
    padding: 9px;
  }

  .day {
    min-height: 65px;
  }

  .shiftbtn {
    font-size: .88rem;
    min-height: 56px;
  }
}
</style>
</head>

<body>
<main class="app">

<header>
  <div>
    <h1>근무달력</h1>
    <div class="sub">한눈에 확인하고, 버튼으로 간편하게 입력해요</div>
  </div>
  <button class="today" id="today">오늘</button>
</header>

<section class="panel">
  <div class="monthrow">
    <button class="nav" id="prev" aria-label="이전 달">‹</button>
    <div class="month" id="month"></div>
    <button class="nav" id="next" aria-label="다음 달">›</button>
  </div>

  <div class="calendar" id="calendar"></div>

  <div class="legend">
    <span><i style="background:#FA6255"></i>주간</span>
    <span><i style="background:#91BEF8"></i>야간</span>
    <span><i style="background:#A6D17D"></i>휴무</span>
    <span><i style="background:#E1C7EC"></i>비번</span>
    <span>🔵 메모 있음</span>
  </div>
</section>

<section class="panel">
  <h2>근무 입력</h2>
  <div class="selected" id="selected"></div>

  <div class="shifts">
    <button class="shiftbtn 주간" data-shift="주간">주간</button>
    <button class="shiftbtn 야간" data-shift="야간">야간</button>
    <button class="shiftbtn 휴무" data-shift="휴무">휴무</button>
    <button class="shiftbtn 비번" data-shift="비번">비번</button>
  </div>

  <div class="actions">
    <button class="secondary" id="clear">근무 지우기</button>
    <button class="secondary" id="saveMemo">메모 저장</button>
  </div>

  <label for="memo">선택한 날짜의 메모</label>
  <textarea id="memo" maxlength="500" placeholder="예: 오전 9시 방문, 준비물 확인"></textarea>

  <div class="fillrow">
    <div style="font-size:.95rem;font-weight:500">입력한 근무 순서로 남은 날짜 채우기</div>
    <p class="help">근무 버튼을 날짜별로 차례로 누른 뒤, 아래 버튼을 누르면 입력한 순서를 반복해 이번 달 남은 날짜를 채워요.</p>
    <button class="primary" id="fill">이번 달 남은 날짜 자동 입력</button>
  </div>
</section>

<section class="panel">
  <h2 id="summaryTitle">월별 근무 합계</h2>

  <div class="summary">
    <div class="countbox"><div class="count" id="c0">0</div><small>주간</small></div>
    <div class="countbox"><div class="count" id="c1">0</div><small>야간</small></div>
    <div class="countbox"><div class="count" id="c2">0</div><small>휴무</small></div>
    <div class="countbox"><div class="count" id="c3">0</div><small>비번</small></div>
  </div>

  <div class="actions">
    <button class="primary" id="image">근무표 이미지 저장</button>
    <button class="secondary" id="backup">백업 파일 저장</button>
  </div>

  <div class="actions">
    <button class="secondary" id="restore">백업 파일 복원</button>
    <button class="secondary" id="clearMonth">이번 달 근무<br>지우기</button>
  </div>

  <input hidden type="file" id="file" accept=".json,application/json">
  <p class="help">이미지는 사진첩이나 다운로드에 저장해 가족에게 보낼 수 있어요. 백업은 기록을 옮기거나 복구할 때 사용해요.</p>
</section>

<div class="foot">광고 없음 · 회원가입 없음 · 기록은 이 기기에 저장됩니다.</div>
</main>

<dialog id="dlg">
  <h2 id="dtitle">확인</h2>
  <p id="dtext"></p>
  <div class="dlgactions">
    <button class="secondary" id="dcancel">취소</button>
    <button class="primary" id="dok">확인</button>
  </div>
</dialog>

<script>
(() => {
'use strict';

const KEY = 'mom-work-calendar-data-v1';
const $ = id => document.getElementById(id);

const key = d =>
  `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

const date = k => {
  let [y,m,d] = k.split('-').map(Number);
  return new Date(y,m-1,d);
};

let now = new Date();
let view = new Date(now.getFullYear(),now.getMonth(),1);
let selected = key(now);
let data = load();
let resolveDialog = null;
let entryStart = null;
let entrySequence = [];

function load() {
  try {
    let d = JSON.parse(localStorage.getItem(KEY) || '{}');
    return {
      shifts: d.shifts || {},
      memos: d.memos || {}
    };
  } catch {
    return {shifts:{},memos:{}};
  }
}

function save() {
  try {
    localStorage.setItem(KEY,JSON.stringify(data));
  } catch {
    alert('저장 공간이 부족할 수 있어요. 백업 파일을 저장해 주세요.');
  }
}

function ask(title,text,yes='확인',no='취소') {
  $('dtitle').textContent = title;
  $('dtext').textContent = text;
  $('dok').textContent = yes;
  $('dcancel').textContent = no;
  $('dlg').showModal();
  return new Promise(r => resolveDialog = r);
}

function close(v) {
  $('dlg').close();
  if (resolveDialog) resolveDialog(v);
  resolveDialog = null;
}

$('dok').onclick = () => close(true);
$('dcancel').onclick = () => close(false);

$('dlg').addEventListener('cancel', e => {
  e.preventDefault();
  close(false);
});

function render() {
  let cal = $('calendar');
  cal.innerHTML = '';

  ['일','월','화','수','목','금','토'].forEach(w => {
    let el = document.createElement('div');
    el.className = 'weekday';
    el.textContent = w;
    cal.append(el);
  });

  let y = view.getFullYear();
  let m = view.getMonth();
  let first = new Date(y,m,1);
  let offset = first.getDay();
  let days = new Date(y,m+1,0).getDate();
  let prevdays = new Date(y,m,0).getDate();
  let total = Math.ceil((offset+days)/7)*7;
  let today = key(new Date());

  $('month').textContent = `${y}년 ${m+1}월`;
  $('summaryTitle').textContent = `${m+1}월 근무 합계`;

  for (let i=0; i<total; i++) {
    let d, out;

    if (i < offset) {
      d = new Date(y,m-1,prevdays-offset+i+1);
      out = true;
    } else if (i >= offset+days) {
      d = new Date(y,m+1,i-offset-days+1);
      out = true;
    } else {
      d = new Date(y,m,i-offset+1);
      out = false;
    }

    let k = key(d);
    let b = document.createElement('button');

    b.type = 'button';
    b.className = 'day' +
      (out ? ' out' : '') +
      (k===selected ? ' sel' : '') +
      (k===today ? ' today' : '');

    b.setAttribute(
      'aria-label',
      `${k}${data.shifts[k]?' '+data.shifts[k]:''}${data.memos[k]?' 메모 있음':''}`
    );

    let n = document.createElement('span');
    n.className = 'num';
    n.textContent = d.getDate();
    b.append(n);

    if (data.memos[k]?.trim()) {
      let dot = document.createElement('i');
      dot.className = 'memo-dot';
      b.append(dot);
    }

    if (data.shifts[k]) {
      let t = document.createElement('span');
      t.className = 'tag ' + data.shifts[k];
      t.textContent =
        data.shifts[k] === '주간' ? '주' :
        data.shifts[k] === '야간' ? '야' :
        data.shifts[k] === '휴무' ? '휴' : '비번';
      b.append(t);
    }

    b.onclick = () => {
      selected = k;
      entryStart = null;
      entrySequence = [];

      if (out) {
        view = new Date(d.getFullYear(),d.getMonth(),1);
      }

      render();
    };

    cal.append(b);
  }

  let d = date(selected);
  let wd = ['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];

  $('selected').textContent =
    `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${wd[d.getDay()]})`;

  $('memo').value = data.memos[selected] || '';

  document.querySelectorAll('[data-shift]').forEach(b => {
    b.setAttribute(
      'aria-pressed',
      String(data.shifts[selected] === b.dataset.shift)
    );
  });

  let counts = ['주간','야간','휴무','비번'].map(s =>
    Object.entries(data.shifts).filter(([k,v]) => {
      let d = date(k);
      return v === s &&
        d.getFullYear() === y &&
        d.getMonth() === m;
    }).length
  );

  counts.forEach((c,i) => $('c'+i).textContent = c);
}

/* 근무 버튼을 누르면 입력 후 다음 날짜로 이동 */
document.querySelectorAll('[data-shift]').forEach(b => {
  b.onclick = () => {
    const chosen = date(selected);

    if (
      entryStart === null ||
      date(entryStart).getFullYear() !== chosen.getFullYear() ||
      date(entryStart).getMonth() !== chosen.getMonth()
    ) {
      entryStart = selected;
      entrySequence = [];
    }

    const expected = new Date(
      chosen.getFullYear(),
      chosen.getMonth(),
      date(entryStart).getDate() + entrySequence.length
    );

    if (entrySequence.length && key(expected) !== selected) {
      entryStart = selected;
      entrySequence = [];
    }

    data.shifts[selected] = b.dataset.shift;
    entrySequence.push(b.dataset.shift);
    save();

    const last = new Date(
      chosen.getFullYear(),
      chosen.getMonth()+1,
      0
    ).getDate();

    if (chosen.getDate() < last) {
      selected = key(new Date(
        chosen.getFullYear(),
        chosen.getMonth(),
        chosen.getDate()+1
      ));
    }

    render();
  };
});

/* 선택한 날짜의 근무 지우기 */
$('clear').onclick = async () => {
  if (
    data.shifts[selected] &&
    await ask('근무 지우기','선택한 날짜의 근무 표시를 지울까요?')
  ) {
    delete data.shifts[selected];
    entryStart = null;
    entrySequence = [];
    save();
    render();
  }
};

/* 메모 저장 */
$('saveMemo').onclick = async () => {
  let v = $('memo').value.trim();

  if (v) {
    data.memos[selected] = v;
  } else {
    delete data.memos[selected];
  }

  save();
  render();

  await ask(
    '메모 저장',
    v ? '메모를 저장했어요.' : '메모를 비웠어요.'
  );
};

/* 이전 달 / 다음 달 */
$('prev').onclick = () => move(-1);
$('next').onclick = () => move(1);

function move(n) {
  let old = date(selected);
  let y = view.getFullYear();
  let m = view.getMonth()+n;

  view = new Date(y,m,1);

  selected = key(new Date(
    view.getFullYear(),
    view.getMonth(),
    Math.min(
      old.getDate(),
      new Date(view.getFullYear(),view.getMonth()+1,0).getDate()
    )
  ));

  entryStart = null;
  entrySequence = [];
  render();
}

/* 오늘 */
$('today').onclick = () => {
  let d = new Date();

  view = new Date(d.getFullYear(),d.getMonth(),1);
  selected = key(d);
  entryStart = null;
  entrySequence = [];

  render();
};

/* 입력한 근무 순서로 이번 달 남은 날짜 자동 채우기 */
$('fill').onclick = async () => {
  if (!entryStart || !entrySequence.length) {
    await ask(
      '입력한 근무가 없어요',
      '먼저 날짜를 선택하고 주간·야간·휴무·비번 버튼을 순서대로 눌러 주세요.'
    );
    return;
  }

  const first = date(entryStart);
  const lastDay = new Date(
    first.getFullYear(),
    first.getMonth()+1,
    0
  ).getDate();

  const startDay = first.getDate()+entrySequence.length;

  if (startDay > lastDay) {
    await ask('채울 날짜가 없어요','이번 달의 남은 날짜가 없어요.');
    return;
  }

  if (!await ask(
    '남은 날짜 자동 입력',
    `${first.getMonth()+1}월 ${startDay}일부터 ${lastDay}일까지, 방금 입력한 ${entrySequence.length}일의 근무 순서를 반복해 채울까요? 이미 입력된 근무는 덮어써져요.`,
    '자동 입력'
  )) return;

  for (let n=startDay; n<=lastDay; n++) {
    data.shifts[key(new Date(
      first.getFullYear(),
      first.getMonth(),
      n
    ))] = entrySequence[(n-first.getDate()) % entrySequence.length];
  }

  save();

  view = new Date(first.getFullYear(),first.getMonth(),1);
  selected = key(new Date(
    first.getFullYear(),
    first.getMonth(),
    lastDay
  ));

  entryStart = null;
  entrySequence = [];

  render();

  await ask('완료','입력한 근무 순서로 이번 달 남은 날짜를 채웠어요.');
};

/* 파일 다운로드 공통 기능 */
function download(blob,name) {
  let u = URL.createObjectURL(blob);
  let a = document.createElement('a');

  a.href = u;
  a.download = name;

  document.body.append(a);
  a.click();
  a.remove();

  setTimeout(() => URL.revokeObjectURL(u),3000);
}

/* 백업 저장 */
$('backup').onclick = () => {
  download(
    new Blob([
      JSON.stringify({
        app:'근무달력',
        version:1,
        data
      },null,2)
    ],{type:'application/json'}),
    `근무달력_백업_${key(new Date())}.json`
  );

  ask(
    '백업 파일 저장',
    '백업 파일을 만들었어요. 다운로드 또는 공유 메뉴를 확인해 안전한 곳에 보관해 주세요.'
  );
};

/* 백업 복원 */
$('restore').onclick = () => $('file').click();

$('file').onchange = async e => {
  let f = e.target.files?.[0];
  if (!f) return;

  try {
    let p = JSON.parse(await f.text());
    let d = p.data || p;

    if (!d.shifts || !d.memos) throw Error();

    if (await ask(
      '백업 복원',
      '현재 기록을 백업 파일 내용으로 바꿀까요? 기존 기록은 덮어써져요.',
      '복원하기'
    )) {
      data = {
        shifts: d.shifts,
        memos: d.memos
      };

      save();
      render();

      await ask('복원 완료','백업 파일을 불러왔어요.');
    }
  } catch {
    await ask(
      '복원 실패',
      '올바른 근무달력 백업 JSON 파일인지 확인해 주세요.'
    );
  } finally {
    e.target.value = '';
  }
};

/* 이번 달 근무 지우기 */
$('clearMonth').onclick = async () => {
  if (!await ask(
    '이번 달 근무 지우기',
    '이번 달 근무를 모두 지울까요? 메모는 유지돼요.',
    '모두 지우기'
  )) return;

  let y = view.getFullYear();
  let m = view.getMonth();

  Object.keys(data.shifts).forEach(k => {
    let d = date(k);

    if (
      d.getFullYear() === y &&
      d.getMonth() === m
    ) {
      delete data.shifts[k];
    }
  });

  entryStart = null;
  entrySequence = [];

  save();
  render();
};

/* 근무표 이미지 저장 */
async function exportImage() {
  let y = view.getFullYear();
  let m = view.getMonth();
  let offset = new Date(y,m,1).getDay();
  let days = new Date(y,m+1,0).getDate();
  let rows = Math.ceil((offset+days)/7);

  let cw = 160;
  let ch = 108;
  let left = 28;
  let top = 130;
  let w = left*2+cw*7;
  let h = top+48+rows*ch+145;

  let c = document.createElement('canvas');
  c.width = w*2;
  c.height = h*2;

  let x = c.getContext('2d');
  x.scale(2,2);

  x.fillStyle = '#fff';
  x.fillRect(0,0,w,h);

  x.fillStyle = '#202733';
  x.font = 'bold 34px sans-serif';
  x.fillText(`${y}년 ${m+1}월 근무표`,left,48);

  x.fillStyle = '#1677f2';
  x.fillRect(left,65,130,6);

  x.fillStyle = '#586474';
  x.font = 'bold 17px sans-serif';
  x.fillText('주간 · 야간 · 휴무 · 비번',left,100);

  let weeks = ['일','월','화','수','목','금','토'];

  weeks.forEach((v,i) => {
    let xx = left+i*cw;

    x.fillStyle = '#e9edf2';
    x.fillRect(xx,top,cw,40);

    x.fillStyle =
      i===0 ? '#b32230' :
      i===6 ? '#135fc1' : '#202733';

    x.font = 'bold 20px sans-serif';
    x.textAlign = 'center';
    x.fillText(v,xx+cw/2,top+27);
  });

  let colors = {
    '주간':'#FA6255',
    '야간':'#91BEF8',
    '휴무':'#A6D17D',
    '비번':'#E1C7EC'
  };

  for (let n=1; n<=days; n++) {
    let idx = offset+n-1;
    let r = Math.floor(idx/7);
    let col = idx%7;
    let xx = left+col*cw;
    let yy = top+40+r*ch;
    let k = key(new Date(y,m,n));

    x.fillStyle = '#fff';
    x.fillRect(xx,yy,cw,ch);

    x.strokeStyle = '#d7dce4';
    x.lineWidth = 1;
    x.strokeRect(xx,yy,cw,ch);

    x.textAlign = 'left';
    x.fillStyle = '#202733';
    x.font = 'bold 22px sans-serif';
    x.fillText(String(n),xx+9,yy+27);

    let s = data.shifts[k];

    if (s) {
      x.fillStyle = colors[s];
      x.beginPath();
      x.arc(xx+cw/2,yy+56,18,0,7);
      x.fill();

      x.fillStyle = '#fff';
      x.font = 'bold 17px sans-serif';
      x.textAlign = 'center';

      x.fillText(
        s==='주간' ? '주' :
        s==='야간' ? '야' :
        s==='휴무' ? '휴' : '비번',
        xx+cw/2,
        yy+63
      );
    }

    if (data.memos[k]?.trim()) {
      x.fillStyle = '#1677f2';
      x.beginPath();
      x.arc(xx+cw-12,yy+16,5,0,7);
      x.fill();

      x.fillStyle = '#586474';
      x.font = '14px sans-serif';
      x.textAlign = 'left';

      let memo = data.memos[k].replace(/\s+/g,' ');

      x.fillText(
        memo.length>9 ? memo.slice(0,9)+'…' : memo,
        xx+8,
        yy+91
      );
    }
  }

  let counts = ['주간','야간','휴무','비번'].map(s =>
    Object.entries(data.shifts).filter(([k,v]) => {
      let d = date(k);
      return v===s &&
        d.getFullYear()===y &&
        d.getMonth()===m;
    }).length
  );

  let sy = top+40+rows*ch+30;

  x.textAlign = 'left';
  x.fillStyle = '#202733';
  x.font = 'bold 20px sans-serif';
  x.fillText('이번 달 합계',left,sy);

  x.font = 'bold 18px sans-serif';

  ['#FA6255','#91BEF8','#A6D17D','#E1C7EC'].forEach((col,i) => {
    x.fillStyle = col;
    x.fillText(
      `${['주간','야간','휴무','비번'][i]} ${counts[i]}일`,
      left+i*170,
      sy+32
    );
  });

  x.fillStyle = '#586474';
  x.font = '14px sans-serif';
  x.fillText(
    '파란색 동그라미가 있는 날짜의 메모는 앱에서 확인하세요.',
    left,
    sy+62
  );

  let blob = await new Promise(r => c.toBlob(r,'image/png'));

  if (!blob) throw Error('png');

  let name = `근무달력_${y}-${String(m+1).padStart(2,'0')}.png`;

  if (
    navigator.share &&
    navigator.canShare &&
    typeof File !== 'undefined'
  ) {
    try {
      let file = new File([blob],name,{type:'image/png'});

      if (navigator.canShare({files:[file]})) {
        await navigator.share({
          files:[file],
          title:`${y}년 ${m+1}월 근무표`
        });
        return;
      }
    } catch(e) {
      if (e.name==='AbortError') return;
    }
  }

  download(blob,name);

  await ask(
    '이미지 만들기 완료',
    '이미지를 저장했어요. 다운로드 항목이나 사진첩을 확인해 주세요.'
  );
}

$('image').onclick = () =>
  exportImage().catch(() =>
    ask(
      '이미지 저장 안내',
      '이미지 저장이 되지 않으면 페이지를 다시 열고 시도해 주세요.'
    )
  );

render();

})();
</script>
