<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1677f2"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="근무달력"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg">
<title>근무달력</title>
<style>
:root{--b:#1677f2;--ink:#202733;--muted:#586474;--line:#d7dce4;--bg:#f2f4f7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:700;font-size:18px;line-height:1.4}
button,input,textarea,select{font:inherit}button{cursor:pointer;touch-action:manipulation}.app{max-width:760px;margin:auto;padding:12px 10px calc(24px + env(safe-area-inset-bottom))}
header,.monthrow{display:flex;align-items:center;justify-content:space-between;gap:8px}header{margin:4px 2px 14px}h1{font-size:1.7rem;margin:0;letter-spacing:-.04em}.sub,.help{font-size:.83rem;color:var(--muted);font-weight:500}.sub{margin-top:3px}
.panel{background:#fff;border:1px solid #d7dce4;border-radius:16px;padding:13px;margin-bottom:12px;box-shadow:0 3px 12px #182a440d}
button{border-radius:12px;font-weight:900}.today,.primary{background:var(--b);color:#fff;border:0;padding:10px 14px;min-height:48px}.nav,.secondary{background:#fff;border:2px solid #cbd2dc;color:var(--ink);min-height:48px;padding:8px 13px}.nav{width:48px;font-size:1.4rem}.month{font-size:1.4rem;font-weight:900}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid #d7dce4;border-left:1px solid #d7dce4;border-radius:7px;overflow:hidden;margin-top:10px}
.weekday{text-align:center;background:#e9edf2;padding:7px 0;border-right:1px solid #d7dce4;border-bottom:1px solid #d7dce4;font-size:.85rem}.weekday:first-child{color:#b32230}.weekday:last-child{color:#135fc1}
.day{position:relative;min-width:0;min-height:76px;padding:4px 2px;background:white;border:0;border-right:1px solid #d7dce4;border-bottom:1px solid #d7dce4;border-radius:0;display:flex;align-items:center;flex-direction:column;gap:3px;color:var(--ink)}
.day.out{background:#f5f6f8;color:#9da5af}.day.sel{background:#e4efff;box-shadow:inset 0 0 0 4px var(--b)}.day.today .num{background:var(--b);color:white;border-radius:50%;min-width:29px;min-height:29px;display:inline-flex;align-items:center;justify-content:center}
.num{font-size:1rem;line-height:1.8}
.tag{font-size:.8rem;border-radius:50%;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;color:#ffffff;font-weight:bold;margin-top:2px}
.주간{background:#D93838}
.야간{background:#1E3A8A}
.휴무{background:#2E7D32}
.비번{background:#C2185B}
.dot{position:absolute;top:4px;right:4px;color:#1677f2;font-size:13px;font-weight:900;font-style:normal}
.dot::after{content:'✓'}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:.8rem}.legend span{display:flex;align-items:center;gap:5px}.legend i{width:14px;height:14px;border-radius:50%}
h2{font-size:1.1rem;margin:0 0 10px}.selected{font-size:1.08rem;margin-bottom:10px}.shifts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.shiftbtn{min-height:62px;border:2px solid transparent;font-size:1rem}.shiftbtn[aria-pressed=true]{border-color:#0759c7;box-shadow:inset 0 0 0 2px white}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:9px}.help{margin:8px 0 0}
label{display:block;margin:10px 0 6px}textarea,select{width:100%;min-height:50px;border:2px solid #cbd2dc;border-radius:12px;padding:10px;background:#fff;color:var(--ink)}textarea{min-height:85px;resize:vertical}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.countbox{text-align:center;border:2px solid #cbd2dc;border-radius:12px;padding:8px 2px}.count{font-size:1.5rem}.countbox small{font-size:.78rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{background:#f0f2f5;border:1px solid #cbd2dc;border-radius:9px;padding:5px 8px;font-size:.85rem}.chip button{border:0;background:none;color:#a22;font-size:1rem;padding:0 2px}
.cycleadd{display:grid;grid-template-columns:1fr auto;gap:8px}.foot{text-align:center;color:var(--muted);font-size:.8rem;padding:5px 8px}
dialog{border:0;border-radius:16px;width:min(92vw,480px);padding:18px;box-shadow:0 10px 40px #0004}dialog::backdrop{background:#121d2c99}dialog h2{font-size:1.25rem}.dlgactions{display:flex;gap:8px;margin-top:14px}.dlgactions button{flex:1}
@media(max-width:380px){body{font-size:16px}.app{padding-left:6px;padding-right:6px}.panel{padding:9px}.day{min-height:65px}.shiftbtn{font-size:.88rem;min-height:56px}}
</style></head><body><main class="app">
<header><div><h1>근무달력</h1><div class="sub">큰 글씨로 쉽게 보는 근무 달력</div></div><button class="today" id="today">오늘</button></header>
<section class="panel"><div class="monthrow"><button class="nav" id="prev" aria-label="이전 달">‹</button><div class="month" id="month"></div><button class="nav" id="next" aria-label="다음 달">›</button></div><div class="calendar" id="calendar"></div>
<div class="legend"><span><i style="background:#D93838"></i>주간</span><span><i style="background:#1E3A8A"></i>야간</span><span><i style="background:#2E7D32"></i>휴무</span><span><i style="background:#C2185B"></i>비번</span><span>✔️ 메모 있음</span></div></section>
<section class="panel"><h2>근무 입력</h2><div class="selected" id="selected"></div><div class="shifts">
<button class="shiftbtn 주간" data-shift="주간">주간</button><button class="shiftbtn 야간" data-shift="야간">야간</button><button class="shiftbtn 휴무" data-shift="휴무">휴무</button><button class="shiftbtn 비번" data-shift="비번">비번</button></div>
<div class="actions"><button class="secondary" id="clear">근무 지우기</button><button class="secondary" id="saveMemo">메모 저장</button></div>
<label for="memo">선택한 날짜의 메모</label><textarea id="memo" maxlength="500" placeholder="예: 오전 9시 방문, 준비물 확인"></textarea><p class="help">근무와 메모는 이 휴대폰의 브라우저에 자동 저장돼요.</p></section>
<section class="panel"><h2>반복 근무 자동 채우기</h2><p class="help">기본 순서: 주간 → 주간 → 야간 → 야간 → 휴무 → 비번. 순서를 바꾼 뒤 시작 날짜부터 그 달 말일까지 채울 수 있어요.</p>
<div id="chips" class="chips"></div><div class="cycleadd"><select id="addshift" aria-label="추가할 근무"><option>주간</option><option>야간</option><option>휴무</option><option>비번</option></select><button class="secondary" id="add">순서 추가</button></div>
<div class="actions"><button class="secondary" id="reset">순서 초기화</button><button class="primary" id="fill">선택일부터 자동 채우기</button></div><p class="help">자동 채우기는 이미 입력한 근무를 덮어쓸 수 있으므로 실행 전 확인해요.</p></section>
<section class="panel"><h2 id="summaryTitle">월별 근무 합계</h2><div class="summary"><div class="countbox"><div class="count" id="c0">0</div><small>주간</small></div><div class="countbox"><div class="count" id="c1">0</div><small>야간</small></div><div class="countbox"><div class="count" id="c2">0</div><small>휴무</small></div><div class="countbox"><div class="count" id="c3">0</div><small>비번</small></div></div>
<div class="actions"><button class="primary" id="image">근무표 이미지 저장</button><button class="secondary" id="backup">백업 파일 저장</button></div><div class="actions"><button class="secondary" id="restore">백업 파일 복원</button><button class="secondary" id="clearMonth">이번 달 근무
